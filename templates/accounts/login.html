<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Smart Energy Analytics</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(circle at 10% 20%, rgba(35, 91, 180, 0.30), transparent 35%),
                radial-gradient(circle at 90% 80%, rgba(20, 75, 160, 0.25), transparent 35%),
                linear-gradient(135deg, #061633, #0a2047, #071a38);

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
        }

        /* Main Authentication Area */
        .auth-container {
            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        /* Login Card */
        .login-card {
            width: 440px;
            max-width: 100%;

            padding: 42px 40px;

            background: rgba(15, 39, 78, 0.94);

            border: 1px solid rgba(73, 132, 218, 0.45);

            border-radius: 24px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.45),
                0 0 35px rgba(30, 91, 180, 0.12);

            backdrop-filter: blur(10px);
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 12px;
        }

        .logo-icon {
            font-size: 34px;
            margin-right: 8px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: #eaf3ff;
        }

        /* Heading */
        .login-title {
            text-align: center;
            font-size: 34px;
            font-weight: 700;

            margin-top: 18px;
            margin-bottom: 10px;

            color: #ffffff;
        }

        .login-subtitle {
            text-align: center;

            font-size: 15px;
            line-height: 1.5;

            color: #a9bfdc;

            margin-bottom: 32px;
        }

        /* Error Message */
        .error-message {
            background: rgba(220, 53, 69, 0.12);

            border: 1px solid rgba(220, 53, 69, 0.45);

            color: #ff9da7;

            padding: 12px 14px;

            border-radius: 10px;

            font-size: 14px;

            margin-bottom: 20px;

            text-align: center;
        }

        /* Form */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;

            font-size: 15px;
            font-weight: 600;

            color: #e7f0fc;

            margin-bottom: 9px;
        }

        /* Input */
        .form-input {
            width: 100%;

            padding: 15px 16px;

            background: #142e57;

            border: 1px solid #315684;

            border-radius: 11px;

            outline: none;

            color: #ffffff;

            font-size: 15px;

            transition: 0.25s ease;
        }

        .form-input::placeholder {
            color: #7892b5;
        }

        .form-input:focus {
            border-color: #4d91e8;

            box-shadow:
                0 0 0 3px rgba(55, 126, 218, 0.16);

            background: #17345f;
        }

        /* Remember Me */
        .remember-row {
            display: flex;

            align-items: center;

            margin-top: 4px;
            margin-bottom: 26px;
        }

        .remember-label {
            display: flex;

            align-items: center;

            gap: 9px;

            color: #a9bfdc;

            font-size: 14px;

            cursor: pointer;
        }

        .remember-label input {
            width: 16px;
            height: 16px;

            accent-color: #347fd1;

            cursor: pointer;
        }

        /* Login Button */
        .login-button {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 11px;

            background: linear-gradient(
                135deg,
                #1d65c1,
                #3289e6
            );

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(29, 101, 193, 0.28);

            transition: all 0.25s ease;
        }

        .login-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(29, 101, 193, 0.38);

            background: linear-gradient(
                135deg,
                #2874d0,
                #4298ed
            );
        }

        .login-button:active {
            transform: translateY(0);
        }

        /* Register Section */
        .register-section {
            text-align: center;

            margin-top: 28px;

            font-size: 14px;

            color: #9fb5d2;
        }

        .register-link {
            color: #59a4f5;

            text-decoration: none;

            font-weight: 600;

            margin-left: 5px;

            transition: 0.2s ease;
        }

        .register-link:hover {
            color: #8bc5ff;

            text-decoration: underline;
        }

        /* Mobile Responsive */
        @media (max-width: 500px) {

            .auth-container {
                padding: 18px;
            }

            .login-card {
                padding: 32px 24px;

                border-radius: 20px;
            }

            .login-title {
                font-size: 29px;
            }

            .logo-text {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<div class="auth-container">

    <div class="login-card">

        <!-- Heading -->
        <h1 class="login-title">
            Welcome Back
        </h1>

        <p class="login-subtitle">
            Enter your credentials to access your energy analytics account
        </p>

        <!-- Error -->
        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <!-- Login Form -->
        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    class="form-input"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-input"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- Remember Me -->
            <div class="remember-row">

                <label class="remember-label">

                    <input
                        type="checkbox"
                        name="remember"
                    >

                    Remember me

                </label>

            </div>


            <!-- Login Button -->
            <button
                type="submit"
                class="login-button"
            >
                Sign in to your account
            </button>

        </form>


        <!-- Register -->
        <div class="register-section">

            Don't have an account?

            <a
                href="/register/"
                class="register-link"
            >
                Create account
            </a>

        </div>

    </div>

</div>

</body>
</html>
